<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Room 2 - Haunted Library</title>

<link rel="stylesheet" href="css/room2.css">

</head>

<body>

<div class="game">

<div class="hud">

<div id="playerName">👤 Guest</div>

<div>⭐ <span id="score">0</span></div>

<div>🎒 <span id="inventory">Empty</span></div>

</div>

<h1>📚 Haunted Library</h1>

<p id="message">

Find all clues before escaping.

</p>

<div class="library">

<div class="object" id="bookshelf">
📚
<p>Bookshelf</p>
</div>

<div class="object" id="painting">
🖼️
<p>Painting</p>
</div>

<div class="object" id="desk">
🪑
<p>Desk</p>
</div>

<div class="object" id="safe">
🔐
<p>Safe</p>
</div>

<div class="object" id="door">
🚪
<p>Exit Door</p>
</div>

</div>

<input
type="text"
id="answer"
placeholder="Enter Door Code">

<br><br>

<button id="unlockBtn">

Unlock Door

</button>

</div>

<script src="js/room2.js"></script>

</body>
</html>
