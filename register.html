<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Register | Escape Room</title>

<link rel="stylesheet"
href="css/auth.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

<div class="box">

<h1>🔐 Escape Room</h1>

<h2>Create Account</h2>

<form id="registerForm">

<input
type="text"
id="name"
placeholder="Full Name"
required>

<input
type="email"
id="regEmail"
placeholder="Email"
required>

<input
type="password"
id="regPassword"
placeholder="Password"
required>

<button type="submit">

Create Account

</button>

<p>

Already have an account?

<a href="login.html">

Login

</a>

</p>

</form>

</div>

</div>

<script src="js/auth.js"></script>

</body>
</html>
