
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Room 3 - Secret Laboratory</title>

<link rel="stylesheet" href="css/room3.css">

</head>

<body>

<div class="game">

<div class="hud">

<div id="playerName">
👤 Guest
</div>

<div>
⭐ <span id="score">0</span>
</div>

<div>
🎒 <span id="inventory">Empty</span>
</div>

</div>

<h1>🧪 Secret Laboratory</h1>

<p id="message">

Find the antidote and escape!

</p>

<div class="lab">

<div class="object" id="computer">

💻

<p>Computer</p>

</div>

<div class="object" id="microscope">

🔬

<p>Microscope</p>

</div>

<div class="object" id="cabinet">

🧪

<p>Chemical Cabinet</p>

</div>

<div class="object" id="dna">

🧬

<p>DNA Sample</p>

</div>

<div class="object" id="door">

🚪

<p>Exit Door</p>

</div>

</div>

<input
type="text"
id="answer"
placeholder="Enter Exit Code">

<br><br>

<button id="unlockBtn">

Unlock Door

</button>

</div>

<script src="js/room3.js"></script>

</body>
</html>
