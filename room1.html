<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escape Room - Room 1</title>

<link rel="stylesheet" href="css/room1.css">

</head>

<body>

<div class="room">

<h1>ROOM 1</h1>

<div class="objects">

<div class="item" id="table">
🪑
<p>Table</p>
</div>

<div class="item" id="clock">
🕒
<p>Clock</p>
</div>

<div class="item" id="locker">
🗄️
<p>Locker</p>
</div>

<div class="item" id="window">
🪟
<p>Window</p>
</div>

<div class="item" id="door">
🚪
<p>Door</p>
</div>

</div>

<div class="passwordBox">

<input
type="text"
id="answer"
placeholder="Enter Door Password">

<button id="unlockBtn">

Unlock Door

</button>

</div>

<div id="message"></div>

<div class="gameInfo">

<div class="timerBox">
⏳ Time Left:
<span id="time">15:00</span>
</div>

<div class="scoreBox">
⭐ Score:
<span id="score">1000</span>
</div>

<button id="hintBtn">
💡 Hint
</button>

</div>

<div class="inventory">

<h2>🎒 Inventory</h2>

<div id="inventory">
No items collected
</div>

</div>

<div class="inventory">

<h2>🎒 Inventory</h2>

<div id="inventory">

No items collected

</div>

</div>

</div>

<script src="js/room1.js"></script>

</body>
</html>
