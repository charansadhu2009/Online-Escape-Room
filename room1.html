<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escape Room - Room 1</title>

<link rel="stylesheet" href="css/room1.css">

</head>

<body>
  
<div id="flashlight"></div>

<div class="game-container">

    <div class="hud">

        <div>⏳ <span id="time">15:00</span></div>

        <div>⭐ <span id="score">1000</span></div>

        <div>🎒 <span id="inventory">Empty</span></div>

    </div>

    <h1>ESCAPE ROOM</h1>

    <div class="escape-room">

        <div class="object table" id="table">
            TABLE
        </div>

        <div class="object clock" id="clock">
            CLOCK
        </div>

        <div class="object locker" id="locker">
            LOCKER
        </div>

        <div class="object window" id="window">
            WINDOW
        </div>

        <div class="object door" id="door">
            DOOR
        </div>

    </div>

    <div class="panel">

        <div id="message">
            Search the room for clues.
        </div>

        <input
        type="text"
        id="answer"
        placeholder="Door Password">

        <button id="unlockBtn">

            Unlock Door

        </button>

        <button id="hintBtn">

            Hint

        </button>

    </div>

</div>
<div id="message"></div>

<div class="gameInfo">

<div class="timerBox">
⏳ Time Left:
<span id="time">15:00</span>
</div>

<div class="scoreBox">
⭐ Score:
<span id="score">1000</span>
</div>

<button id="hintBtn">
💡 Hint
</button>

</div>

<div class="inventory">

<h2>🎒 Inventory</h2>

<div id="inventory">
No items collected
</div>

</div>

<div class="inventory">

<h2>🎒 Inventory</h2>

<div id="inventory">

No items collected

</div>

</div>

</div>

<audio id="bgMusic" loop>
    <source src="audio/bg.mp3" type="audio/mpeg">
</audio>

<audio id="clickSound">
    <source src="audio/click.mp3" type="audio/mpeg">
</audio>

<audio id="unlockSound">
    <source src="audio/unlock.mp3" type="audio/mpeg">
</audio>

<script src="js/room1.js"></script>
</body>
</html>
<div class="progress">

<h2>📋 Puzzle Progress</h2>

<p id="progress">

0 / 4 Clues Found

</p>

</div>
