<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escape Room - Room 1</title>

<link rel="stylesheet" href="css/room1.css">

</head>

<body>

<div id="flashlight"></div>

<div class="game-container">

    <!-- HUD -->
    <div class="hud">

        <div id="playerDisplay">
            👤 Player
        </div>

        <div>
            ⏳ <span id="time">15:00</span>
        </div>

        <div>
            ⭐ <span id="score">1000</span>
        </div>

        <div>
            🎒 <span id="inventory">Empty</span>
        </div>

    </div>

    <h1>🏚 ESCAPE ROOM</h1>

    <!-- Room -->
    <div class="escape-room">

        <div class="object table" id="table">
            🪑
            <p>Table</p>
        </div>

        <div class="object clock" id="clock">
            🕒
            <p>Clock</p>
        </div>

        <div class="object locker" id="locker">
            🗄
            <p>Locker</p>
        </div>

        <div class="object window" id="window">
            🪟
            <p>Window</p>
        </div>

        <div class="object door" id="door">
            🚪
            <p>Door</p>
        </div>

    </div>

    <!-- Puzzle Panel -->
    <div class="panel">

        <div id="message">
            Search the room for clues.
        </div>

        <input
            type="text"
            id="answer"
            placeholder="Enter Door Password">

        <br><br>

        <button id="unlockBtn">
            🔓 Unlock Door
        </button>

        <button id="hintBtn">
            💡 Hint
        </button>

    </div>

    <!-- Progress -->
    <div class="progress">

        <h2>📋 Puzzle Progress</h2>

        <p id="progress">
            0 / 4 Clues Found
        </p>

    </div>

</div>

<!-- Pause Button -->
<button id="pauseBtn">
⏸ Pause
</button>

<!-- Settings Button -->
<button id="settingsBtn">
⚙️ Settings
</button>

<!-- Pause Menu -->
<div id="pauseMenu" class="pause-menu">

    <h1>Game Paused</h1>

    <button id="resumeBtn">
        ▶ Resume
    </button>

    <button id="restartBtn">
        🔄 Restart
    </button>

    <button id="homeBtn">
        🏠 Home
    </button>

</div>

<!-- Settings Menu -->
<div id="settingsMenu" class="settings-menu">

    <h2>⚙ Game Settings</h2>

    <label>
        <input
        type="checkbox"
        id="musicToggle"
        checked>

        Background Music
    </label>

    <br><br>

    <label>

        <input
        type="checkbox"
        id="soundToggle"
        checked>

        Sound Effects

    </label>

    <br><br>

    <button id="closeSettings">

        Close

    </button>

</div>

<!-- Audio -->

<audio id="bgMusic" loop>

    <source src="audio/bg.mp3" type="audio/mpeg">

</audio>

<audio id="clickSound">

    <source src="audio/click.mp3" type="audio/mpeg">

</audio>

<audio id="unlockSound">

    <source src="audio/unlock.mp3" type="audio/mpeg">

</audio>

<script src="js/room1.js"></script>

</body>
</html>
